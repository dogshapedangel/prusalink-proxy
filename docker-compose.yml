

services:
  caddy:
    image: ghcr.io/caddy-dns/cloudflare:latest
    container_name: caddy-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.template:/etc/caddy/Caddyfile.template:ro
      - ./init.sh:/etc/caddy/init.sh:ro
      - ./printers-index.html:/srv/printers/index.html:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ./.env
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    entrypoint: ["/bin/sh", "/etc/caddy/init.sh"]
    depends_on:
      - prusalink-digest-proxy
      - go2rtc
      - oauth2-proxy
      - authz-ad
    networks:
      - prusalink-network
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    networks:
      - prusalink-network
    restart: unless-stopped

  prusalink-digest-proxy:
    # Satisfies PrusaLink's HTTP Digest auth so browsers never see the credential prompt.
    build:
      context: ./digest-proxy
    container_name: prusalink-digest-proxy
    env_file:
      - ./.env
    environment:
      # Legacy single-printer fallback; omit these when using PRINTER_IDS + PRINTER_<ID>_* entries.
      PRUSALINK_URL: ${PRUSALINK_URL:-}
      PRUSALINK_USERNAME: ${PRUSALINK_USERNAME:-}
      PRUSALINK_PASSWORD: ${PRUSALINK_PASSWORD:-}
      DIGEST_PROXY_PORT: 8080
    networks:
      - prusalink-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: oauth2-proxy-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - prusalink-network
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    env_file:
      - ./.env
    environment:
      # Azure AD B2C OIDC Configuration
      # Azure B2C custom policies expose a metadata document that returns an issuer,
      # but the issuer URL itself is not a discovery endpoint. Skip discovery and
      # point oauth2-proxy at the concrete authorize/token/JWKS URLs.
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Azure AD B2C
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${AZURE_B2C_OIDC_ISSUER_URL}
      OAUTH2_PROXY_LOGIN_URL: ${AZURE_B2C_LOGIN_URL}
      OAUTH2_PROXY_REDEEM_URL: ${AZURE_B2C_REDEEM_URL}
      OAUTH2_PROXY_OIDC_JWKS_URL: ${AZURE_B2C_JWKS_URL}
      OAUTH2_PROXY_SKIP_CLAIMS_FROM_PROFILE_URL: "true"
      OAUTH2_PROXY_CLIENT_ID: ${AZURE_B2C_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${AZURE_B2C_CLIENT_SECRET}
      # Leave redirect URL unset by default so oauth2-proxy derives the full
      # https://<current-host>/oauth2/callback URL from the forwarded request.
      OAUTH2_PROXY_SCOPE: ${OAUTH2_PROXY_SCOPE:-openid profile email offline_access}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: ${AZURE_B2C_EMAIL_CLAIM:-email}
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

      # Session & Cookie
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_proxy
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_DOMAINS: ${OAUTH2_PROXY_COOKIE_DOMAINS:-}
      OAUTH2_PROXY_COOKIE_EXPIRE: "168h"
      OAUTH2_PROXY_COOKIE_REFRESH: "24h"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${OAUTH2_PROXY_WHITELIST_DOMAINS:-}
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://redis:6379/0

      # Security
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"

      # Logging
      OAUTH2_PROXY_STANDARD_LOGGING: "true"
      OAUTH2_PROXY_AUTH_LOGGING: "true"
    depends_on:
      - redis
    networks:
      - prusalink-network
    restart: unless-stopped

  authz-ad:
    build:
      context: ./authz-ad
    container_name: authz-ad
    env_file:
      - ./.env
    environment:
      AUTHZ_AD_LISTEN: 0.0.0.0:8081
      AUTHZ_AD_ENFORCE: ${AUTHZ_AD_ENFORCE:-true}
      AUTHZ_AD_HEADER_EMAIL: ${AUTHZ_AD_HEADER_EMAIL:-X-Auth-Request-Email}
      AUTHZ_AD_HEADER_USER: ${AUTHZ_AD_HEADER_USER:-X-Auth-Request-User}
      AUTHZ_AD_CACHE_TTL_SECONDS: ${AUTHZ_AD_CACHE_TTL_SECONDS:-300}
      AUTHZ_AD_NEGATIVE_CACHE_TTL_SECONDS: ${AUTHZ_AD_NEGATIVE_CACHE_TTL_SECONDS:-60}
      AUTHZ_AD_LDAP_URI: ${AUTHZ_AD_LDAP_URI}
      AUTHZ_AD_BIND_DN: ${AUTHZ_AD_BIND_DN}
      AUTHZ_AD_BIND_PASSWORD: ${AUTHZ_AD_BIND_PASSWORD}
      AUTHZ_AD_BASE_DN: ${AUTHZ_AD_BASE_DN}
      AUTHZ_AD_ALLOWED_GROUP_DN: ${AUTHZ_AD_ALLOWED_GROUP_DN}
      AUTHZ_AD_IDENTITY_ATTRS: ${AUTHZ_AD_IDENTITY_ATTRS:-mail,userPrincipalName,sAMAccountName}
      AUTHZ_AD_CONNECT_TIMEOUT_SECONDS: ${AUTHZ_AD_CONNECT_TIMEOUT_SECONDS:-2}
      AUTHZ_AD_READ_TIMEOUT_SECONDS: ${AUTHZ_AD_READ_TIMEOUT_SECONDS:-2}
      AUTHZ_AD_TLS_VALIDATE: ${AUTHZ_AD_TLS_VALIDATE:-true}
      AUTHZ_AD_TLS_CA_CERT_FILE: ${AUTHZ_AD_TLS_CA_CERT_FILE:-}
      AUTHZ_AD_LOG_LEVEL: ${AUTHZ_AD_LOG_LEVEL:-INFO}
    networks:
      - prusalink-network
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  prusalink-network:
    driver: bridge
