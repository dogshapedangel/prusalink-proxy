# oauth2-proxy configuration for PrusaLink with Azure AD B2C
# Configuration is loaded from .env file in docker-compose.yml
# See: https://oauth2-proxy.github.io/oauth2-proxy/configuration

# ============================================
# Basic Settings
# ============================================
# Listen only internally on port 4180 (Caddy handles HTTPS on 443)
http_address = "0.0.0.0:4180"

# In multi-domain reverse-proxy setups, leave redirect_url unset so oauth2-proxy
# derives the callback from X-Forwarded-Proto and X-Forwarded-Host.
# If you set this explicitly for Azure AD B2C, it must be a full absolute URL.
# redirect_url = "https://printer.example.com/oauth2/callback"

# ============================================
# OAuth Provider: Azure AD B2C
# ============================================
provider = "oidc"
provider_display_name = "Azure AD B2C"

# Azure AD B2C custom policies need manual endpoints because the metadata document
# returns an issuer that does not itself host .well-known/openid-configuration.
# Example metadata URL:
# https://your-tenant.b2clogin.com/your-tenant.onmicrosoft.com/v2.0/.well-known/openid-configuration?p=B2C_1_signupsignin
skip_oidc_discovery = true
oidc_issuer_url = "PASTE_THE_ISSUER_VALUE_FROM_OPENID_CONFIGURATION_HERE"
login_url = "PASTE_THE_AUTHORIZATION_ENDPOINT_HERE"
redeem_url = "PASTE_THE_TOKEN_ENDPOINT_HERE"
oidc_jwks_url = "PASTE_THE_JWKS_URI_HERE"
skip_claims_from_profile_url = true
client_id = "YOUR_AZURE_B2C_CLIENT_ID"
client_secret = "YOUR_AZURE_B2C_CLIENT_SECRET"

# Recommended for Azure AD B2C
# Include your app's client ID or an API scope so Azure AD B2C returns an access token.
scope = "openid profile email offline_access YOUR_CLIENT_ID"
code_challenge_method = "S256"
oidc_email_claim = "email"

# ============================================
# Upstream Service: Handled by Caddy
# ============================================
# oauth2-proxy is used only for authentication.
# Caddy forwards authenticated traffic through an internal digest bridge so
# the browser never sees PrusaLink's HTTP Digest challenge.

# ============================================
# Session & Cookie Settings
# ============================================
# Secret key for signing cookies (generate with: openssl rand -base64 32)
cookie_secret = "GENERATE_WITH_openssl_rand_-base64_32"
cookie_name = "_oauth2_proxy"
cookie_httponly = true
cookie_secure = true
cookie_samesite = "Lax"
# 7 days
cookie_expire = "168h"
# 24 hours
cookie_refresh = "24h"

# ============================================
# Access Control: Allow specific users/groups
# ============================================
# Allow all authenticated Azure AD B2C users
# (Uncomment and modify if you want to restrict further)
# allowed_groups = [
#   "b2c_group_name"
# ]

# Allow specific email domains
# allowed_domains = [
#   "example.com"
# ]

# ============================================
# Security Settings
# ============================================
# Do not pass browser Authorization headers upstream
pass_authorization_header = false
# Set X-Forwarded-User header
pass_user_headers = true
# Validate SSL certificates
ssl_upstream_insecure_skip_verify = false

# ============================================
# Logging
# ============================================
standard_logging = true
auth_logging = true
auth_logging_format = "{{.ClientIP}} - {{.User}} [{{.Timestamp}}] {{.RequestMethod}} {{.UpstreamURL}} {{.Status}}"
